<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2329;
    min-height: 100vh;
    padding: 0 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    width: 100%; max-width: 440px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
  }
  .topbar .left {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; color: #2f6bff; letter-spacing: .3px;
  }
  .topbar .left::before {
    content: '';
    display: inline-block; width: 6px; height: 6px;
    background: #2f6bff; border-radius: 50%;
  }
  .code { font-family: "SF Mono", Consolas, monospace; font-size: 12px; color: #9aa0a6; letter-spacing: .5px; }
  .head-label {
    width: 100%; max-width: 440px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px 8px;
    border-bottom: 1px solid #ecedf0; margin-bottom: 12px;
  }
  .head-label .title { font-size: 18px; font-weight: 700; color: #2f6bff; letter-spacing: 1px; }
  .head-label .sub { font-size: 11px; color: #9aa0a6; }
  .title { font-size: 21px; font-weight: 600; line-height: 1.35; margin: 2px 2px 12px; color: #1f2329; }
  .wrap { width: 100%; max-width: 440px; padding: 0 14px; }
  .pic {
    background: #fff; border-radius: 16px; padding: 14px;
    margin-bottom: 12px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.04);
  }
  .pic img {
    width: auto; max-width: 100%; max-height: 460px; height: auto;
    border-radius: 10px; display: block; margin: 0 auto; object-fit: contain;
  }
  .pic .no-img { color: #c7c7cc; padding: 60px 0; font-size: 14px; }
  .info {
    background: #fff; border-radius: 16px; padding: 4px 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.04);
  }
  .row {
    display: flex; align-items: baseline; padding: 14px 0;
    border-bottom: 1px solid #f0f0f2; font-size: 15px; line-height: 1.55;
  }
  .row:last-child { border-bottom: none; }
  .lbl { color: #8a9099; width: 84px; flex-shrink: 0; font-size: 13px; }
  .val { color: #1f2329; word-break: break-all; flex: 1; }
  .val.empty { color: #c7c7cc; }
  .val.hl { color: #2f6bff; font-weight: 600; }
  .foot { text-align: center; color: #c2c6cc; font-size: 11px; padding: 18px 0 0; }
