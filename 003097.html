  * { box-sizing: border-box; margin: 0; padding: 0; }

  }
  .divider { height: 1px; background: #ecedf0; margin: 0 0 12px; }

  .info { padding: 0 4px; }
  .row {
    display: flex; align-items: baseline; padding: 14px 0;

  }
  .row:last-child { border-bottom: none; }
  .lbl { color: #8a9099; width: 84px; flex-shrink: 0; font-size: 13px; }
  .val { color: #1f2329; word-break: break-all; flex: 1; }
