<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2329;
    min-height: 100vh;
    padding: 14px 0 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 440px; padding: 0 14px; }
  .pic {
    background: #fff; border-radius: 16px; padding: 14px;
    margin-bottom: 14px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.04);
  }
  .pic img {
    width: 100%; max-height: 520px; height: auto;
    border-radius: 10px; display: block; margin: 0 auto; object-fit: contain;
  }
  .pic .no-img { color: #c7c7cc; padding: 80px 0; font-size: 14px; }
  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 2px 4px 0; margin-bottom: 10px;
  }
  .head .title {
    font-size: 22px; font-weight: 700; color: #1f2329; line-height: 1.3;
    flex: 1; letter-spacing: .5px;
  }
  .head .sub {
    font-size: 13px; color: #9aa0a6; flex-shrink: 0; white-space: nowrap;
  }
  .divider { height: 1px; background: #ecedf0; margin: 0 0 12px; }
  .code-block {
    font-size: 17px; color: #1f2329;
    padding: 0 4px 14px;
    font-family: "SF Mono", Consolas, monospace; letter-spacing: .5px;
  }
  .info { padding: 0 4px; }
  .row {
    display: flex; align-items: baseline; padding: 14px 0;
    border-bottom: 1px solid #f0f0f2; font-size: 15px; line-height: 1.55;
  }
  .row:last-child { border-bottom: none; }
  .lbl { color: #8a9099; width: 84px; flex-shrink: 0; font-size: 13px; }
  .val { color: #1f2329; word-break: break-all; flex: 1; }
  .val.empty { color: #c7c7cc; }
  .val.hl { color: #2f6bff; font-weight: 600; }
</style>
